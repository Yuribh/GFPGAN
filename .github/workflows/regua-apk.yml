name: Régua APK

# Builds an installable Android APK of regua-app/app and publishes it at
# https://github.com/<owner>/<repo>/releases/download/regua-apk/regua.apk
on:
  push:
    branches: [claude/regua-app-iyjqep]
    paths: ['regua-app/app/**', '.github/workflows/regua-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regua-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: regua-app/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: regua-app/app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

      # generates android/ from app.json; release is signed with the template's debug key (fine for sideloading, not for Play Store)
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}

      # keys are optional: without them the APK uses sample data, test ads and no subscription
      - name: App keys (public, they end up in the app bundle)
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ vars.EXPO_PUBLIC_SUPABASE_URL }}"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}"
            echo "EXPO_PUBLIC_REVENUECAT_ANDROID_KEY=${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}"
            echo "EXPO_PUBLIC_ADMOB_ANDROID_BANNER=${{ vars.EXPO_PUBLIC_ADMOB_ANDROID_BANNER }}"
            echo "EXPO_PUBLIC_SENTRY_DSN=${{ vars.EXPO_PUBLIC_SENTRY_DSN }}"
            echo "EXPO_PUBLIC_SUPPORT_EMAIL=${{ vars.REGUA_EMAIL }}"
          } | grep -v '=$' > .env.local || true

      - run: ./gradlew assembleRelease --no-daemon
        working-directory: regua-app/app/android

      - run: cp android/app/build/outputs/apk/release/app-release.apk regua.apk

      - uses: actions/upload-artifact@v4
        with:
          name: regua-apk
          path: regua-app/app/regua.apk

      - name: Publish to the regua-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete regua-apk --cleanup-tag --yes || true
          gh release create regua-apk regua.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Régua APK (teste)" \
            --notes "APK de teste do Régua, gerado a partir de $GITHUB_SHA. Dados de exemplo. Instale no Android permitindo apps de fontes desconhecidas."
