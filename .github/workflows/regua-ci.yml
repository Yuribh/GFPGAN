name: Régua CI

# Every push to the app: unit tests, type check, database checks, and an end-to-end smoke test with REAL FIPE data:
# fresh database -> migrations -> import of a small slice of the live FIPE API -> read back through PostgREST
# (the REST layer Supabase uses) with the app's own data code.
on:
  push:
    branches: [master, claude/regua-app-iyjqep]
    paths: ['regua-app/app/**', '.github/workflows/regua-ci.yml']
  pull_request:
    paths: ['regua-app/app/**', '.github/workflows/regua-ci.yml']
  workflow_dispatch:

concurrency:
  group: regua-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: regua-app/app
    env:
      NODE_OPTIONS: --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: regua-app/app/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit

      - name: Start PostgreSQL (preinstalled on the runner)
        run: sudo systemctl start postgresql.service && pg_lsclusters
      - name: Database checks (access rules, ingestion, billing, quotas)
        run: sudo -E bash supabase/tests/run.sh

      - name: Fresh database like a new Supabase project
        run: |
          sudo -u postgres psql -q -c "create role ci login superuser password 'ci'" -c "create database regua_ci"
          for r in anon authenticated service_role; do sudo -u postgres psql -q -c "do \$\$ begin if not exists (select 1 from pg_roles where rolname='$r') then create role $r nologin; end if; end \$\$"; done
          sudo -u postgres psql -q -d regua_ci < supabase/tests/supabase_stub.sql
      - name: Migrations
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/regua_ci
        run: node scripts/migrate.mts && node scripts/migrate.mts
      - name: Import a slice of the real FIPE table
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/regua_ci
          FIPE_API_TOKEN: ${{ secrets.FIPE_API_TOKEN }}
        run: node scripts/import-fipe.mts --months 2 --budget 40 --rpm 120
      - name: Read it back through PostgREST with the app's code
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/regua_ci
        run: |
          sudo -u postgres psql -q -d regua_ci < supabase/tests/after_migrate.sql
          sudo -u postgres psql -q -c "create role authenticator login noinherit password 'auth'" -c "grant anon to authenticator"
          curl -sL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar xJ -C /tmp
          SECRET=ci-secret-ci-secret-ci-secret-ci-secret-12345
          printf 'db-uri = "postgres://authenticator:auth@127.0.0.1:5432/regua_ci"\ndb-schemas = "public"\ndb-anon-role = "anon"\njwt-secret = "%s"\nserver-port = 3000\n' "$SECRET" > /tmp/pgrst.conf
          /tmp/postgrest /tmp/pgrst.conf > /tmp/pgrst.log 2>&1 &
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          ANON_KEY=$(node -e "const c=require('crypto');const b=o=>Buffer.from(JSON.stringify(o)).toString('base64url');const h=b({alg:'HS256',typ:'JWT'}),p=b({role:'anon'});console.log(h+'.'+p+'.'+c.createHmac('sha256','$SECRET').update(h+'.'+p).digest('base64url'))")
          PGRST_URL=http://127.0.0.1:3000 ANON_KEY="$ANON_KEY" node scripts/smoke-read.mts
