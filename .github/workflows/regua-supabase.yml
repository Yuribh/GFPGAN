name: Régua Supabase deploy

# Puts the backend online in your Supabase project: database tables (migrations), the Edge Functions
# (plate lookup, consultant, vehicle history, billing webhook, account deletion, FIPE import) and their secrets.
# Run it from Actions › Régua Supabase deploy › Run workflow; it also runs when the functions or migrations change.
# Needs (Settings › Secrets and variables › Actions):
#   secrets: SUPABASE_ACCESS_TOKEN (supabase.com › Account › Access Tokens), SUPABASE_DB_URL (Session pooler URI)
#   variable: SUPABASE_PROJECT_REF (the id in your project URL: https://<ref>.supabase.co)
#   optional secrets, sent to the functions when set: PLATE_API_URL, PLATE_API_TOKEN, PLATE_API_AUTH, PLATE_HASH_PEPPER,
#   HISTORY_API_URL, HISTORY_API_TOKEN, HISTORY_API_AUTH, ANTHROPIC_API_KEY, REVENUECAT_SECRET_KEY,
#   REVENUECAT_WEBHOOK_SECRET, FIPE_API_TOKEN, INGEST_CRON_SECRET
on:
  workflow_dispatch:
  push:
    branches: [master, claude/regua-app-iyjqep]
    paths: ['regua-app/app/supabase/functions/**', 'regua-app/app/supabase/migrations/**', 'regua-app/app/server/**', '.github/workflows/regua-supabase.yml']

concurrency:
  group: regua-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: regua-app/app
    env:
      NODE_OPTIONS: --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check settings
        id: cfg
        working-directory: .
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing secret SUPABASE_ACCESS_TOKEN,"
          [ -n "$PROJECT_REF" ] || missing="$missing variable SUPABASE_PROJECT_REF,"
          [ -n "$DATABASE_URL" ] || missing="$missing secret SUPABASE_DB_URL,"
          if [ -n "$missing" ]; then
            echo "::notice title=Supabase not configured::Missing:${missing%,}. Nothing deployed. See regua-app/app/PUBLICAR.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: regua-app/app/package-lock.json
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest
      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      - name: Database tables (migrations)
        if: steps.cfg.outputs.ready == 'true'
        run: node scripts/migrate.mts

      - name: Function secrets
        if: steps.cfg.outputs.ready == 'true'
        env:
          PLATE_API_URL: ${{ secrets.PLATE_API_URL }}
          PLATE_API_TOKEN: ${{ secrets.PLATE_API_TOKEN }}
          PLATE_API_AUTH: ${{ secrets.PLATE_API_AUTH }}
          PLATE_HASH_PEPPER: ${{ secrets.PLATE_HASH_PEPPER }}
          HISTORY_API_URL: ${{ secrets.HISTORY_API_URL }}
          HISTORY_API_TOKEN: ${{ secrets.HISTORY_API_TOKEN }}
          HISTORY_API_AUTH: ${{ secrets.HISTORY_API_AUTH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
          REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
          FIPE_API_TOKEN: ${{ secrets.FIPE_API_TOKEN }}
          INGEST_CRON_SECRET: ${{ secrets.INGEST_CRON_SECRET }}
        run: |
          # only the ones you set; values never appear in the log
          : > /tmp/fn.env
          for k in PLATE_API_URL PLATE_API_TOKEN PLATE_API_AUTH PLATE_HASH_PEPPER HISTORY_API_URL HISTORY_API_TOKEN HISTORY_API_AUTH \
                   ANTHROPIC_API_KEY REVENUECAT_SECRET_KEY REVENUECAT_WEBHOOK_SECRET FIPE_API_TOKEN INGEST_CRON_SECRET; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v" >> /tmp/fn.env; echo "set $k"; else echo "skip $k (not set)"; fi
          done
          if [ -s /tmp/fn.env ]; then supabase secrets set --env-file /tmp/fn.env --project-ref "$PROJECT_REF"; fi
          rm -f /tmp/fn.env

      - name: Edge Functions
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # one self-contained file per function (shared code from server/ bundled in)
          node scripts/build-functions.mjs
          cd supabase/.build
          printf 'project_id = "regua"\n' > supabase/config.toml
          # every function checks its caller itself (install id + quotas, RevenueCat signature, user token, cron secret),
          # so the gateway JWT check is off: it would reject the new publishable keys, which are not JWTs
          for f in plate-lookup advisor vehicle-history billing-webhook delete-account ingest-fipe; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done

      - name: Check the plate function answers
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # an invalid plate costs nothing (no provider call, no quota); 400 means the function is up
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/plate-lookup" \
            -H 'content-type: application/json' -d '{"plate":"X","installId":"11111111-1111-4111-8111-111111111111"}')
          echo "plate-lookup answered HTTP $code: $(cat /tmp/out)"
          case "$code" in
            400) echo "OK: plate-lookup is online" ;;
            503) echo "::warning title=Plate lookup not configured::The function is online but PLATE_HASH_PEPPER (and the provider secrets) are missing." ;;
            *) exit 1 ;;
          esac
